name: CI de TecnoFix

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura
        run: |
          test -f README.md
          test -f requirements.txt
          test -f src/ordenes.py
 
